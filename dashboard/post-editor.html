<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Post Editor — Skoolyst Blog Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <div class="sidebar-backdrop"></div>
    <aside class="dash-sidebar">
      <div class="sidebar-brand">
        <span class="brand-dot"></span>
        Skoolyst
        <span class="brand-sub">Blog</span>
      </div>
      <ul class="sidebar-nav">
        <li class="sidebar-section-label">Main</li>
        <li><a href="index.html"><span class="nav-icon">🏠</span> Overview</a></li>
        <li><a href="posts.html"><span class="nav-icon">📝</span> Posts</a></li>
        <li><a href="post-editor.html" class="active"><span class="nav-icon">✏️</span> New Post</a></li>
        <li><a href="categories.html"><span class="nav-icon">🏷</span> Categories</a></li>
        <li><a href="media.html"><span class="nav-icon">📷</span> Media</a></li>
        <li class="sidebar-section-label">System</li>
        <li><a href="#" onclick="return false"><span class="nav-icon">⚙️</span> Settings</a></li>
        <li><a href="../index.html"><span class="nav-icon">🔗</span> View Site</a></li>
      </ul>
      <div class="sidebar-footer">
        © 2026 Skoolyst
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="dash-sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div class="topbar-title">
            <h1 id="editor-page-title">New Post</h1>
            <p>Create or edit a blog post</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a href="posts.html" class="btn-secondary-dash">← Back to Posts</a>
          <div class="topbar-user">
            <img src="https://i.pravatar.cc/150?img=47" alt="" />
            <div>
              <div class="user-name" id="topbar-user-name">…</div>
              <div class="user-role" id="topbar-user-role"></div>
            </div>
          </div>
          <button type="button" class="btn-secondary-dash" id="dash-logout-btn" style="padding:.5rem .9rem">Log Out</button>
        </div>
      </header>

      <main class="dash-content">
        <form class="editor-form" id="post-editor-form">
          <div class="editor-grid">
            <div>
              <div class="dash-card">
                <div class="card-header"><h3>Content</h3></div>
                <div class="card-body" id="editor-content-fields"></div>
              </div>

              <div class="dash-card">
                <div class="card-header"><h3>SEO</h3></div>
                <div class="card-body" id="editor-seo-fields"></div>
              </div>
            </div>

            <div class="editor-sidebar">
              <div class="sidebar-card">
                <h4>Publish</h4>
                <div id="editor-status-field"></div>
              </div>

              <div class="sidebar-card">
                <h4>Category</h4>
                <div id="editor-category-field"></div>
              </div>

              <div class="sidebar-card">
                <h4>Tags</h4>
                <div id="editor-tags-field"></div>
              </div>

              <div class="sidebar-card">
                <h4>Cover Image</h4>
                <div id="editor-cover-field"></div>
                <div class="cover-preview" id="cover-preview"></div>
              </div>
            </div>
          </div>

          <div class="editor-actions">
            <button type="submit" class="btn-primary-dash">Save Post</button>
            <button type="button" class="btn-secondary-dash" id="editor-cancel">Cancel</button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/dashboard.js"></script>
  <script>
    /* Wire cover upload click */
    document.addEventListener('DOMContentLoaded', function () {
      var uploadArea = document.getElementById('cover-upload');
      var fileInput = document.getElementById('cover-input');
      if (uploadArea && fileInput) {
        uploadArea.addEventListener('click', function () { fileInput.click(); });
      }
    });
  </script>
</body>
</html>
