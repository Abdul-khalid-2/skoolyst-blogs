<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Skoolyst Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/dashboard.css" />
</head>
<body>
  <div class="dash-layout">
    <div class="sidebar-backdrop"></div>
    <aside class="dash-sidebar">
      <div class="sidebar-brand">
        <span class="brand-dot"></span>
        Skoolyst
        <span class="brand-sub">Blog</span>
      </div>
      <ul class="sidebar-nav">
        <li class="sidebar-section-label">Main</li>
        <li><a href="index.html" class="active"><span class="nav-icon">🏠</span> Overview</a></li>
        <li><a href="posts.html"><span class="nav-icon">📝</span> Posts</a></li>
        <li><a href="post-editor.html"><span class="nav-icon">✏️</span> New Post</a></li>
        <li><a href="categories.html"><span class="nav-icon">🏷</span> Categories</a></li>
        <li><a href="media.html"><span class="nav-icon">📷</span> Media</a></li>
        <li class="sidebar-section-label">System</li>
        <li><a href="#" onclick="return false"><span class="nav-icon">⚙️</span> Settings</a></li>
        <li><a href="../index.html"><span class="nav-icon">🔗</span> View Site</a></li>
      </ul>
      <div class="sidebar-footer">
        © 2026 Skoolyst
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-topbar">
        <div style="display:flex;align-items:center;gap:.75rem">
          <button class="dash-sidebar-toggle" aria-label="Toggle sidebar">☰</button>
          <div class="topbar-title">
            <h1>Overview</h1>
            <p>Welcome back, Sarah</p>
          </div>
        </div>
        <div class="topbar-actions">
          <a href="post-editor.html" class="btn-primary-dash">+ New Post</a>
          <div class="topbar-user">
            <img src="https://i.pravatar.cc/150?img=47" alt="" />
            <div>
              <div class="user-name" id="topbar-user-name">…</div>
              <div class="user-role" id="topbar-user-role"></div>
            </div>
          </div>
          <button type="button" class="btn-secondary-dash" id="dash-logout-btn" style="padding:.5rem .9rem">Log Out</button>
        </div>
      </header>

      <main class="dash-content">
        <div class="stat-grid" id="dash-stats"></div>

        <div class="dash-card">
          <div class="card-header">
            <h3>Monthly Views</h3>
            <span style="font-size:.85rem;color:var(--text-muted)">Last 8 months</span>
          </div>
          <div class="card-body">
            <div class="bar-chart" id="views-chart"></div>
          </div>
        </div>

        <div class="dash-card">
          <div class="card-header">
            <h3>Recent Posts</h3>
            <a href="posts.html" style="font-size:.85rem;font-weight:600">View all →</a>
          </div>
          <div class="dash-table-wrap">
            <table class="dash-table">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Status</th>
                  <th>Views</th>
                  <th>Date</th>
                </tr>
              </thead>
              <tbody id="recent-posts"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
